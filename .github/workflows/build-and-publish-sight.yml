name: Build and Publish sight py package

on:
  push:
    branches:
      # - main
      - tyclay/logging-demo # TODO: remove before actually merging BADBAD
    # paths:
      # - 'py/sight/**' # TODO: configure where the sight python package is at in one place instead of everywhere

env:
  PYTHON_REGISTRY: 'https://us-python.pkg.dev'
  PYTHON_REGISTRY_PROJECT: ''
  PYTHON_INDEX: ''
  WIF_PROVIDER: '
  WIF_SERVICE_ACCOUNT: '

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

# TODO: rachet the versions
jobs:
  build:
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      id-token: 'write'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@149f6c87b92550901b26acd1632e11c3662e381f # ratchet:arduino/setup-protoc@v1
        with:
          version: '3.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Compile python proto bindings'
        run: |
          pip install grpcio-tools
          make proto-sight
      
